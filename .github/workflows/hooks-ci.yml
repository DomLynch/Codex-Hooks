name: Hook checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-hooks:
    runs-on: [self-hosted, codex-hooks-local]
    env:
      HOOK_SENTRY_DSN: ""
    steps:
      - uses: actions/checkout@v4

      - name: Verify check tools
        run: |
          python3 --version
          if ! command -v ruff >/dev/null 2>&1; then
            python3 -m pip install --user ruff
          fi
          ruff --version
          python3 -m pytest --version >/dev/null 2>&1 || python3 -m pip install --user pytest
          python3 -m pytest --version

      - name: Install isolated telemetry SDK for contract tests
        run: sh scripts/install-telemetry.sh

      - name: Run Codex hook tests
        run: python3 -m unittest discover -s hooks/tests

      - name: Run Claude hook tests
        # pytest, not unittest: unittest skips the plain test_ functions (a stale assertion slipped through that way)
        run: python3 -m pytest claude/hooks/tests -q -p no:cacheprovider

      - name: Compile hook Python
        run: python3 -m py_compile $(find hooks claude/hooks -name '*.py' -not -path '*/__pycache__/*')

      - name: Lint hooks
        run: ruff check hooks claude/hooks
