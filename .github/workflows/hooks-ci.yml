name: Hook checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-hooks:
    runs-on: [self-hosted, codex-hooks-local]
    steps:
      - uses: actions/checkout@v4

      - name: Verify check tools
        run: |
          python3 --version
          if ! command -v ruff >/dev/null 2>&1; then
            python3 -m pip install --user ruff
          fi
          ruff --version

      - name: Run Codex hook tests
        run: python3 -m unittest discover -s hooks/tests

      - name: Run Claude hook tests
        run: python3 -m unittest discover -s claude/hooks/tests

      - name: Compile hook Python
        run: python3 -m py_compile $(find hooks claude/hooks -name '*.py' -not -path '*/__pycache__/*')

      - name: Lint hooks
        run: ruff check hooks claude/hooks
