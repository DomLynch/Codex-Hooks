# Sanitized hook config snippet.
# Copy these blocks into ~/.codex/config.toml and adjust paths if needed.

[mcp_servers.serena]
command = "/Users/domininclynch/.local/bin/serena"
args = ["start-mcp-server", "--context=codex", "--project-from-cwd", "--enable-web-dashboard", "false", "--open-web-dashboard", "false"]

[features]
hooks = true

[[hooks.Stop]]

[[hooks.Stop.hooks]]
type = "command"
command = "python3 /Users/domininclynch/.codex/hooks/mimo_audit.py"
timeout = 180
statusMessage = "GPT-6-Sol audit"

[[hooks.Stop.hooks]]
type = "command"
command = "python3 /Users/domininclynch/.codex/hooks/stop_orchestrator.py"
timeout = 960
statusMessage = "Stop orchestrator"

[[hooks.SessionStart]]
matcher = "startup|resume"

[[hooks.SessionStart.hooks]]
type = "command"
command = "python3 /Users/domininclynch/.codex/hooks/session_start.py"
timeout = 30
statusMessage = "Loading session handoff"

[[hooks.UserPromptSubmit]]

[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = "python3 /Users/domininclynch/.codex/hooks/user_prompt_submit.py"
timeout = 10
statusMessage = "AAA task router"

# One-deployer rule: while Frankendom's deploy.sh holds ~/.claude/state/deploy_in_flight.json, refuse the heavy
# commands (browser checks, whole suites, builds, bakes) from every other session. Shares the Claude install's
# lock on purpose - one deployer per Mac, not one per agent. Light commands are never blocked.
[[hooks.PreToolUse]]
matcher = "^(exec|shell|Bash)$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "python3 /Users/domininclynch/.codex/hooks/deploy_guard.py"
timeout = 10
statusMessage = "Deploy guard"

[[hooks.PostToolUse]]

[[hooks.PostToolUse.hooks]]
type = "command"
command = "python3 /Users/domininclynch/.codex/hooks/post_tool.py"
timeout = 180
statusMessage = "Quality floor"
